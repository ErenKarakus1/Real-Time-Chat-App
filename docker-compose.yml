services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: real_time_chat
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d real_time_chat"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

  migrate:
    build:
      context: ./backend
    command: ["/app/migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/real_time_chat?sslmode=disable
      MIGRATIONS_DIR: /app/migrations

  backend:
    build:
      context: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      CORS_ALLOWED_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/real_time_chat?sslmode=disable
      GIN_MODE: debug
      JWT_SECRET: change-me-for-local-dev
      PORT: 8080
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"

volumes:
  postgres_data:
